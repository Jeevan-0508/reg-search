name: Weekly regulatory search refresh

on:
  schedule:
    - cron: '0 9 * * 1' # 09:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reg-search-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Sync the cited source-of-truth records
        run: node scripts/sync-source.mjs
      - name: Run the existing search tests
        run: bun test
      - name: Commit only meaningful source changes
        run: |
          git config user.name "reg-search-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data.js data/source-provenance.json data/source-history.jsonl
          if git diff --cached --quiet; then
            echo "NO_CHANGE: cited regulatory records unchanged."
            exit 0
          fi
          git commit -m "Weekly regulatory source refresh"
          git push
